<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Multizone Thermostat — Home Assistant Live Dashboard</title>
  
  <!-- Material Design Icons Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">

  <style>
    :root {
      /* Home Assistant Theme Matching Image 1 */
      --primary-color: #03a9f4;
      --accent-color: #ff9800;
      --primary-text-color: #ffffff;
      --secondary-text-color: #94a3b8;
      --text-primary-color: #ffffff;
      --card-background-color: #101726;
      --ha-card-background: #101726;
      --ha-card-border-color: rgba(255, 255, 255, 0.08);
      --ha-card-border-width: 1px;
      --ha-card-border-radius: 20px;
      --ha-card-box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --divider-color: rgba(255, 255, 255, 0.08);
      --state-climate-heat-color: #f97316;
      --state-climate-cool-color: #0284c7;
      --state-climate-idle-color: #64748b;
      --state-climate-off-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #090d16;
      color: #e1e8f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.3s ease;
    }

    /* Classic Home Assistant Native Dark Theme (Flat Charcoal) */
    body.classic-theme {
      background-color: #111111 !important;
      color: #e1e8f5 !important;
      --ha-card-background: #1c1d21 !important;
      --card-background-color: #1c1d21 !important;
      --ha-card-border-color: rgba(255, 255, 255, 0.12) !important;
      --divider-color: rgba(255, 255, 255, 0.12) !important;
      --ha-card-box-shadow: none !important;
    }
    body.classic-theme .ha-topbar {
      background-color: #18191d !important;
      border-bottom-color: rgba(255, 255, 255, 0.08) !important;
    }

    /* Top Bar: Home Assistant Header Style */
    .ha-topbar {
      background-color: #0f1422;
      border-bottom: 1px solid #1c2438;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .ha-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
    }
    .ha-brand i {
      color: #03a9f4;
      font-size: 1.3rem;
    }

    /* View Navigation Tabs */
    .ha-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 100%;
    }
    .ha-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
      padding: 0 18px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #94a3b8;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .ha-tab:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
    }
    .ha-tab.active {
      color: #03a9f4;
      border-bottom-color: #03a9f4;
      background: rgba(3, 169, 244, 0.08);
    }
    .ha-tab i {
      font-size: 1.15rem;
    }

    /* Style Switcher Action */
    .ha-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .style-pill-btn {
      background: #172033;
      border: 1px solid #2a3754;
      color: #cbd5e1;
      padding: 5px 13px;
      border-radius: 20px;
      font-size: 0.80rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .lang-select {
      background: #172033;
      border: 1px solid #2a3754;
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.80rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    .lang-select:hover, .lang-select:focus {
      background: #202c46;
      border-color: #38bdf8;
      color: #ffffff;
    }
    .style-pill-btn:hover {
      background: #202c46;
      border-color: #03a9f4;
      color: #ffffff;
    }
    .style-pill-btn.luxury-active {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-color: #7dd3fc;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Main Dashboard Area (Matches Home Assistant Grid Width) */
    .dashboard-container {
      width: 100%;
      max-width: 1360px;
      margin: 0 auto;
      padding: 16px 12px;
      flex: 1;
    }

    .dashboard-view {
      display: none;
      flex-direction: column;
      gap: 14px;
    }
    .dashboard-view.active {
      display: flex;
    }

    /* TOP ROW: EXACT 4-COLUMN RATIO AS HOME ASSISTANT */
    .ha-top-row-grid {
      display: grid;
      grid-template-columns: 1.35fr 1.35fr 0.65fr 0.65fr;
      gap: 12px;
      width: 100%;
      align-items: stretch;
    }
    @media (max-width: 1100px) {
      .ha-top-row-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 700px) {
      .ha-top-row-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ZONES GRID: 2 COLUMNS DEFAULT AS IN HOME ASSISTANT SCREENSHOT */
    .ha-zones-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }
    .ha-zones-grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    @media (max-width: 800px) {
      .ha-zones-grid, .ha-zones-grid.cols-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>

<body>

  <!-- TOP APP BAR -->
  <header class="ha-topbar">
    <div class="ha-brand">
      <i class="mdi mdi-home-thermometer-outline"></i>
      <span>Multizone Thermostat</span>
    </div>

    <!-- TABS -->
    <nav class="ha-tabs">
      <button class="ha-tab active" id="tabBtnHome" onclick="switchView('view-home')">
        <i class="mdi mdi-radiator"></i>
        <span>Termostati</span>
      </button>
      <button class="ha-tab" id="tabBtnSched" onclick="switchView('view-sched')">
        <i class="mdi mdi-calendar-clock"></i>
        <span>Programmazione</span>
      </button>
      <button class="ha-tab" id="tabBtnDiag" onclick="switchView('view-diag')">
        <i class="mdi mdi-chart-box-outline"></i>
        <span>Diagnostica</span>
      </button>
    </nav>

    <!-- RIGHT: LANGUAGE, LUXURY / CLASSIC STYLE TOGGLE & COLUMNS TOGGLE -->
    <div class="ha-actions">
      <select class="lang-select" id="langSelector" onchange="changeLanguage(this.value)" title="Change Language">
        <option value="en">🇬🇧 English</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="ru">🇷🇺 Русский</option>
      </select>
      <button class="style-pill-btn" id="colSwitcherBtn" onclick="toggleCols()">
        <span id="colBtnIcon">📐</span> <span id="colBtnText">Griglia: 2 Colonne</span>
      </button>
      <button class="style-pill-btn luxury-active" id="styleSwitcherBtn" onclick="toggleStyle()">
        <span id="styleBtnIcon">💎</span> <span id="styleBtnText">Stile: Luxury</span>
      </button>
    </div>
  </header>

  <!-- DASHBOARD CONTAINER -->
  <main class="dashboard-container">

    <!-- ============================================== -->
    <!-- VIEW 1: TERMOSTATI (IDENTICA A SCREENSHOT 1)  -->
    <!-- ============================================== -->
    <div class="dashboard-view active" id="view-home">
      
      <!-- TOP ROW: [ PRESET CARD ] [ STATUS CARD ] [ PROGRAMMAZIONE ] [ DIAGNOSTICA ] -->
      <div class="ha-top-row-grid">
        <div id="host-preset-card"></div>
        <div id="host-status-card"></div>
        <div id="host-schedule-summary"></div>
        <div id="host-health-summary"></div>
      </div>

      <!-- ZONES ROW: [ ZONA 1 (SPLIT) ] [ ZONA 2 (STANDARD) ] [ ZONA 3 (STUDIO) ] -->
      <div class="ha-zones-grid">
        <div id="host-dial-1"></div>
        <div id="host-dial-2"></div>
        <div id="host-dial-3"></div>
      </div>
    </div>

    <!-- ============================================== -->
    <!-- VIEW 2: PROGRAMMAZIONE SETTIMANALE             -->
    <!-- ============================================== -->
    <div class="dashboard-view" id="view-sched">
      <div id="host-scheduler-card"></div>
    </div>

    <!-- ============================================== -->
    <!-- VIEW 3: DIAGNOSTICA & EFFICIENZA               -->
    <!-- ============================================== -->
    <div class="dashboard-view" id="view-diag">
      <div id="host-plant-card" style="margin-bottom: 12px;"></div>
      <div class="ha-zones-grid">
        <div id="host-energy-1"></div>
        <div id="host-energy-2"></div>
        <div id="host-energy-3"></div>
      </div>
    </div>

  </main>

      // CALLSERVICE REALE
      callService: function(domain, service, data) {
        console.log(`[HA SERVICE] ${domain}.${service}`, data);

        // 1. Modifica Temperatura
        if (domain === 'climate' && service === 'set_temperature') {
          const eid = data.entity_id;
          if (MOCK_HASS.states[eid]) {
            MOCK_HASS.states[eid].attributes.temperature = data.temperature;
            const cur = MOCK_HASS.states[eid].attributes.current_temperature;
            const isMasterOn = MOCK_HASS.states['switch.master_control_heating_master'].state === 'on';
            if (isMasterOn) {
              MOCK_HASS.states[eid].attributes.hvac_action = data.temperature > cur ? 'heating' : 'idle';
            }
          }
        }

        // 2. Modifica Preset o Priorità o Modalità Stagionale
        else if (domain === 'select' && service === 'select_option') {
          const eid = data.entity_id;
          if (MOCK_HASS.states[eid]) {
            MOCK_HASS.states[eid].state = data.option;

            if (eid.includes('global_preset')) {
              const presets = {
                comfort: { z1: 20.5, z2: 20.5, z3: 20.0 },
                eco: { z1: 18.5, z2: 18.0, z3: 18.0 },
                sleep: { z1: 17.5, z2: 18.0, z3: 17.0 },
                away: { z1: 16.0, z2: 16.0, z3: 16.0 },
                manual: {}
              };
              if (presets[data.option]) {
                const p = presets[data.option];
                if (p.z1) MOCK_HASS.states['climate.multizone_thermostat_zona_test_1'].attributes.temperature = p.z1;
                if (p.z2) MOCK_HASS.states['climate.multizone_thermostat_zona_test_2'].attributes.temperature = p.z2;
                if (p.z3) MOCK_HASS.states['climate.multizone_thermostat_zona_test_3'].attributes.temperature = p.z3;
              }
            }

            // Priorità Sorgente (Auto, Ibrido, Combinato, Elettrico, Gas)
            if (eid.includes('heat_source_priority')) {
              const priority = data.option;
              const z1 = MOCK_HASS.states['climate.multizone_thermostat_zona_test_1'];
              const z2 = MOCK_HASS.states['climate.multizone_thermostat_zona_test_2'];
              const z3 = MOCK_HASS.states['climate.multizone_thermostat_zona_test_3'];

              if (priority === 'electric_only') {
                if (z1) z1.attributes.active_heating_source = 'electric';
                if (z2) z2.attributes.active_heating_source = 'electric';
                if (z3) z3.attributes.active_heating_source = 'gas';
              } else if (priority === 'combined') {
                if (z1) z1.attributes.active_heating_source = 'dual';
                if (z2) z2.attributes.active_heating_source = 'dual';
                if (z3) z3.attributes.active_heating_source = 'gas';
              } else if (priority === 'gas_only') {
                if (z1) z1.attributes.active_heating_source = 'gas';
                if (z2) z2.attributes.active_heating_source = 'gas';
                if (z3) z3.attributes.active_heating_source = 'gas';
              } else { // auto / hybrid
                if (z1) z1.attributes.active_heating_source = 'electric';
                if (z2) z2.attributes.active_heating_source = 'gas';
                if (z3) z3.attributes.active_heating_source = 'gas';
              }
            }

            // Commutazione Stagionale (Caldo / Freddo)
            if (eid.includes('master_operation_mode')) {
              const isCool = (data.option === 'cool');
              const isMasterOn = (MOCK_HASS.states['switch.master_control_heating_master'].state === 'on');

              MOCK_HASS.states['switch.caldaia'].state = (!isCool && isMasterOn) ? 'on' : 'off';

              ['climate.multizone_thermostat_zona_test_1', 'climate.multizone_thermostat_zona_test_2', 'climate.multizone_thermostat_zona_test_3'].forEach(zid => {
                const z = MOCK_HASS.states[zid];
                if (z) {
                  if (isMasterOn) {
                    if (isCool) {
                      const canCool = z.attributes.can_cool !== false;
                      z.state = canCool ? 'cool' : 'off';
                      z.attributes.hvac_action = canCool ? 'cooling' : 'off';
                    } else {
                      z.state = 'heat';
                      z.attributes.hvac_action = 'heating';
                    }
                  } else {
                    z.state = 'off';
                    z.attributes.hvac_action = z.attributes.split_active ? 'heating' : 'off';
                  }
                }
              });
            }

            // Selezione Modalità Zona (Primaria, Secondaria, Bypass)
            if (eid.includes('zone_mode')) {
              const zoneMap = {
                'select.multizone_thermostat_zona_test_1_zone_mode': 'climate.multizone_thermostat_zona_test_1',
                'select.multizone_thermostat_zona_test_2_zone_mode': 'climate.multizone_thermostat_zona_test_2',
                'select.multizone_thermostat_zona_test_3_zone_mode': 'climate.multizone_thermostat_zona_test_3'
              };
              const targetClimate = zoneMap[eid];
              if (targetClimate && MOCK_HASS.states[targetClimate]) {
                MOCK_HASS.states[targetClimate].attributes.zone_mode = data.option;
              }
            }
          }
        }

        // 3. Modifica Interruttore (Master ON / OFF / TOGGLE o Caldaia)
        else if (domain === 'switch') {
          const eid = data.entity_id;
          if (MOCK_HASS.states[eid]) {
            let turnOn;
            if (service === 'toggle') {
              turnOn = (MOCK_HASS.states[eid].state !== 'on');
            } else {
              turnOn = (service === 'turn_on');
            }
            MOCK_HASS.states[eid].state = turnOn ? 'on' : 'off';

            if (eid.includes('master_control_heating_master') || eid.includes('master')) {
              const isCool = (MOCK_HASS.states['select.master_control_master_operation_mode']?.state === 'cool');
              MOCK_HASS.states['switch.caldaia'].state = (!isCool && turnOn) ? 'on' : 'off';

              ['climate.multizone_thermostat_zona_test_1', 'climate.multizone_thermostat_zona_test_2', 'climate.multizone_thermostat_zona_test_3'].forEach(zid => {
                const z = MOCK_HASS.states[zid];
                if (z) {
                  if (turnOn) {
                    if (isCool) {
                      const canCool = z.attributes.can_cool !== false;
                      z.state = canCool ? 'cool' : 'off';
                      z.attributes.hvac_action = canCool ? 'cooling' : 'off';
                    } else {
                      z.state = 'heat';
                      z.attributes.hvac_action = 'heating';
                    }
                  } else {
                    z.state = z.attributes.split_active ? 'heat' : 'off';
                    z.attributes.hvac_action = z.attributes.split_active ? 'heating' : 'off';
                  }
                }
              });
            }
          }
        }

        // 4. Modifica HVAC Mode (Split Locale Climatizzazione o Termostato)
        else if (domain === 'climate' && service === 'set_hvac_mode') {
          const eid = data.entity_id;
          const hvacMode = data.hvac_mode;
          if (MOCK_HASS.states[eid]) {
            MOCK_HASS.states[eid].state = hvacMode;
            if (eid === 'climate.multizone_thermostat_zona_test_1' || eid === 'climate.split_test_1') {
              const isSplitActive = (hvacMode !== 'off');
              const z1 = MOCK_HASS.states['climate.multizone_thermostat_zona_test_1'];
              const sp1 = MOCK_HASS.states['climate.split_test_1'];
              if (z1) {
                z1.attributes.split_active = isSplitActive;
                z1.attributes.split_manual_on = isSplitActive;
                z1.attributes.active_heating_source = isSplitActive ? 'electric' : 'gas';
                const isMasterOn = MOCK_HASS.states['switch.master_control_heating_master'].state === 'on';
                if (isSplitActive) {
                  z1.attributes.hvac_action = 'heating';
                } else {
                  z1.attributes.hvac_action = isMasterOn ? (z1.attributes.temperature > z1.attributes.current_temperature ? 'heating' : 'idle') : 'off';
                }
              }
              if (sp1) {
                sp1.state = hvacMode;
              }
            }
          }
        }

        // Aggiorna tutte le card registrate
        updateAllCards();
      }
    };

    function updateAllCards() {
      const hassCopy = {
        language: MOCK_HASS.language,
        states: Object.assign({}, MOCK_HASS.states),
        callService: MOCK_HASS.callService
      };

      activeCards.forEach(c => {
        try { c.hass = hassCopy; } catch (e) { console.error(e); }
      });

      // Se una card si nasconde in estate (es. Studio privo di condizionatore), nascondi anche lo slot di griglia
      setTimeout(() => {
        ['host-dial-1', 'host-dial-2', 'host-dial-3'].forEach(id => {
          const host = document.getElementById(id);
          if (host && host.firstElementChild) {
            host.style.display = host.firstElementChild.style.display === 'none' ? 'none' : '';
          }
        });
      }, 20);
    }

    // Navigazione Viste
    function switchView(viewId) {
      document.querySelectorAll('.dashboard-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.ha-tab').forEach(t => t.classList.remove('active'));

      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');

      if (viewId === 'view-home') document.getElementById('tabBtnHome').classList.add('active');
      if (viewId === 'view-sched') document.getElementById('tabBtnSched').classList.add('active');
      if (viewId === 'view-diag') document.getElementById('tabBtnDiag').classList.add('active');

      setTimeout(updateAllCards, 40);
    }

      if (tabHome) tabHome.textContent = t.tab_thermostats;
      if (tabSched) tabSched.textContent = t.tab_scheduling;
      if (tabDiag) tabDiag.textContent = t.tab_diagnostics;

      const colText = document.getElementById('colBtnText');
      if (colText) colText.textContent = currentCols === 2 ? t.col_2 : t.col_3;

      const styleText = document.getElementById('styleBtnText');
      if (styleText) styleText.textContent = isLuxury ? t.style_luxury : t.style_classic;

      if (MOCK_HASS.states['climate.multizone_thermostat_zona_test_1']) {
        MOCK_HASS.states['climate.multizone_thermostat_zona_test_1'].attributes.friendly_name = t.living_room;
      }
      if (MOCK_HASS.states['climate.multizone_thermostat_zona_test_2']) {
        MOCK_HASS.states['climate.multizone_thermostat_zona_test_2'].attributes.friendly_name = t.kitchen;
      }
      if (MOCK_HASS.states['climate.multizone_thermostat_zona_test_3']) {
        MOCK_HASS.states['climate.multizone_thermostat_zona_test_3'].attributes.friendly_name = t.office;
      }

      updateAllCards();
    }

    // Toggle Colonne Griglia (2 o 3 colonne)
    let currentCols = 2;
    function toggleCols() {
      currentCols = currentCols === 2 ? 3 : 2;
      document.querySelectorAll('.ha-zones-grid').forEach(g => {
        if (currentCols === 3) {
          g.classList.add('cols-3');
        } else {
          g.classList.remove('cols-3');
        }
      });
      const lang = MOCK_HASS.language || 'en';
      const t = UI_I18N[lang] || UI_I18N.en;
      document.getElementById('colBtnText').textContent = currentCols === 2 ? t.col_2 : t.col_3;
    }

    // Style Switcher
    let isLuxury = localStorage.getItem('mz_card_style') !== 'classic';

    function toggleStyle() {
      isLuxury = !isLuxury;
      const newStyle = isLuxury ? 'luxury' : 'classic';
      localStorage.setItem('mz_card_style', newStyle);

      const btn = document.getElementById('styleSwitcherBtn');
      const icon = document.getElementById('styleBtnIcon');
      const text = document.getElementById('styleBtnText');
      const lang = MOCK_HASS.language || 'en';
      const t = UI_I18N[lang] || UI_I18N.en;

      if (isLuxury) {
        btn.classList.add('luxury-active');
        icon.textContent = '💎';
        text.textContent = t.style_luxury;
        document.body.classList.remove('classic-theme');
      } else {
        btn.classList.remove('luxury-active');
        icon.textContent = '🏛️';
        text.textContent = t.style_classic;
        document.body.classList.add('classic-theme');
      }

      window.dispatchEvent(new CustomEvent('mz-style-changed', { detail: { style: newStyle } }));
    }

    // Inizializzazione
    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('mz_simulator_lang') || 'en';
      const langSel = document.getElementById('langSelector');
      if (langSel) {
        langSel.value = savedLang;
      }

      const saved = localStorage.getItem('mz_card_style') || 'luxury';
      if (saved === 'classic') {
        isLuxury = false;
        const btn = document.getElementById('styleSwitcherBtn');
        btn.classList.remove('luxury-active');
        document.getElementById('styleBtnIcon').textContent = '🏛️';
        document.body.classList.add('classic-theme');
      }

      mountCards();
      changeLanguage(savedLang);
    });
  </script>
</body>
</html>
