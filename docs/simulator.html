<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Multizone Thermostat — Home Assistant Live Dashboard</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">

  <style>
    :root {
      --primary-color: #03a9f4;
      --accent-color: #ff9800;
      --primary-text-color: #ffffff;
      --secondary-text-color: #94a3b8;
      --text-primary-color: #ffffff;
      --card-background-color: #101726;
      --ha-card-background: #101726;
      --ha-card-border-color: rgba(255, 255, 255, 0.08);
      --ha-card-border-width: 1px;
      --ha-card-border-radius: 20px;
      --ha-card-box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --divider-color: rgba(255, 255, 255, 0.08);
      --state-climate-heat-color: #f97316;
      --state-climate-cool-color: #0284c7;
      --state-climate-idle-color: #64748b;
      --state-climate-off-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #090d16;
      color: #e1e8f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.3s ease;
    }

    body.classic-theme {
      background-color: #111111 !important;
      color: #e1e8f5 !important;
      --ha-card-background: #1c1d21 !important;
      --card-background-color: #1c1d21 !important;
      --ha-card-border-color: rgba(255, 255, 255, 0.12) !important;
      --divider-color: rgba(255, 255, 255, 0.12) !important;
      --ha-card-box-shadow: none !important;
    }
    body.classic-theme .ha-topbar {
      background-color: #18191d !important;
      border-bottom-color: rgba(255, 255, 255, 0.08) !important;
    }

    .ha-topbar {
      background-color: #0f1422;
      border-bottom: 1px solid #1c2438;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ha-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
    }
    .ha-brand i { color: #03a9f4; font-size: 1.3rem; }

    .ha-tabs { display: flex; align-items: center; gap: 4px; height: 52px; flex-wrap: wrap; }
    .ha-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
      padding: 0 15px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #94a3b8;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .ha-tab:hover { color: #ffffff; background: rgba(255, 255, 255, 0.04); }
    .ha-tab.active {
      color: #03a9f4;
      border-bottom-color: #03a9f4;
      background: rgba(3, 169, 244, 0.08);
    }
    .ha-tab i { font-size: 1.15rem; }

    .ha-actions { display: flex; align-items: center; gap: 8px; }
    .style-pill-btn {
      background: #172033;
      border: 1px solid #2a3754;
      color: #cbd5e1;
      padding: 5px 13px;
      border-radius: 20px;
      font-size: 0.80rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .lang-select {
      background: #172033;
      border: 1px solid #2a3754;
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.80rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    .lang-select:hover, .lang-select:focus {
      background: #202c46; border-color: #38bdf8; color: #ffffff;
    }
    .style-pill-btn:hover { background: #202c46; border-color: #03a9f4; color: #ffffff; }
    .style-pill-btn.luxury-active {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-color: #7dd3fc;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .dashboard-container {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      padding: 16px 12px 36px;
      flex: 1;
    }

    .dashboard-view { display: none; flex-direction: column; gap: 14px; }
    .dashboard-view.active { display: flex; }

    .ha-top-row-grid {
      display: grid;
      grid-template-columns: 1.35fr 1.35fr 0.65fr 0.65fr;
      gap: 12px;
      width: 100%;
      align-items: stretch;
    }
    @media (max-width: 1100px) { .ha-top-row-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px) { .ha-top-row-grid { grid-template-columns: 1fr; } }

    .ha-zones-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }
    .ha-zones-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 800px) {
      .ha-zones-grid, .ha-zones-grid.cols-3 { grid-template-columns: 1fr; }
    }

    .sim-backend-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.22);
    }
    .sim-backend-lbl {
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #94a3b8;
      margin-right: 4px;
    }
    .sim-backend-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .sim-backend-btn:hover { border-color: #38bdf8; color: #ffffff; }
    .sim-backend-btn.active {
      background: rgba(14, 165, 233, 0.26);
      border-color: #38bdf8;
      color: #ffffff;
    }

    ha-card { display: block; }
  </style>

          const path = MDI_SVG_MAP[name];
          const inner = path

<body>

  <header class="ha-topbar">
    <div class="ha-brand">
      <i class="mdi mdi-home-thermometer-outline"></i>
      <span>Multizone Thermostat</span>
    </div>

    <nav class="ha-tabs">
      <button class="ha-tab active" id="tabBtnHome" onclick="switchView('view-home')">
        <i class="mdi mdi-radiator"></i>
        <span>Termostati</span>
      </button>
      <button class="ha-tab" id="tabBtnSched" onclick="switchView('view-sched')">
        <i class="mdi mdi-calendar-clock"></i>
        <span>Programmazione</span>
      </button>
      <button class="ha-tab" id="tabBtnDiag" onclick="switchView('view-diag')">
        <i class="mdi mdi-chart-box-outline"></i>
        <span>Diagnostica</span>
      </button>
      <button class="ha-tab" id="tabBtnTelemetry" onclick="openTelemetryTab('plant')">
        <i class="mdi mdi-chart-areaspline"></i>
        <span>Grafici &amp; Telemetria</span>
      </button>
    </nav>

    <div class="ha-actions">
      <select class="lang-select" id="langSelector" onchange="changeLanguage(this.value)" title="Change Language">
        <option value="en">🇬🇧 English</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="ru">🇷🇺 Русский</option>
      </select>
      <button class="style-pill-btn" id="colSwitcherBtn" onclick="toggleCols()">
        <span id="colBtnIcon">📐</span> <span id="colBtnText">Griglia: 2 Colonne</span>
      </button>
      <button class="style-pill-btn luxury-active" id="styleSwitcherBtn" onclick="toggleStyle()">
        <span id="styleBtnIcon">💎</span> <span id="styleBtnText">Stile: Luxury</span>
      </button>
    </div>
  </header>

  <main class="dashboard-container">

    <!-- VIEW 1: TERMOSTATI -->
    <div class="dashboard-view active" id="view-home">
      <div class="ha-top-row-grid">
        <div id="host-preset-card"></div>
        <div id="host-status-card"></div>
        <div id="host-schedule-summary"></div>
        <div id="host-health-summary"></div>
      </div>
      <div class="ha-zones-grid">
        <div id="host-dial-1"></div>
        <div id="host-dial-2"></div>
        <div id="host-dial-3"></div>
      </div>
    </div>

    <!-- VIEW 2: PROGRAMMAZIONE SETTIMANALE -->
    <div class="dashboard-view" id="view-sched">
      <div id="host-scheduler-card"></div>
    </div>

    <!-- VIEW 3: DIAGNOSTICA & EFFICIENZA -->
    <div class="dashboard-view" id="view-diag">
      <div id="host-plant-card" style="margin-bottom: 12px;"></div>
      <div class="ha-zones-grid">
        <div id="host-energy-1"></div>
        <div id="host-energy-2"></div>
        <div id="host-energy-3"></div>
      </div>
    </div>

    <!-- VIEW 4: GRAFICI & TELEMETRIA DEDICATA -->
    <div class="dashboard-view" id="view-telemetry">
      <div class="sim-backend-bar">
        <span class="sim-backend-lbl" id="sim-backend-lbl">Simulate Plant Backend:</span>
        <button type="button" class="sim-backend-btn active" data-sim-backend="opentherm">🔥 OpenTherm</button>
        <button type="button" class="sim-backend-btn" data-sim-backend="relay">⚡ Relay PWM</button>
        <button type="button" class="sim-backend-btn" data-sim-backend="heat_pump">🌿 Heat Pump + PV</button>
        <button type="button" class="sim-backend-btn" data-sim-backend="centralized">🏢 Centralized</button>
      </div>
      <div id="host-telemetry-card"></div>
    </div>

  </main>

  <script>
    const MOCK_HASS = {
      language: 'en',
      states: {
        'switch.master_control_heating_master': {
          entity_id: 'switch.master_control_heating_master',

      callWS: async function(msg) {
        if (!msg || msg.type !== 'history/history_during_period') return {};
        const startMs = Date.parse(msg.start_time) || (Date.now() - 24 * 3600 * 1000);
        const endMs = Date.parse(msg.end_time) || Date.now();
        const spanSec = Math.max(3600, (endMs - startMs) / 1000);
        const points = 72;
        const out = {};
        const bType = MOCK_HASS.states['sensor.master_control_master_demand']?.attributes?.boiler_type || 'opentherm';

        (msg.entity_ids || []).forEach((eid) => {
          const rows = [];
          for (let i = 0; i < points; i++) {
            const frac = i / (points - 1);
            const lu = Math.round((startMs / 1000) + frac * spanSec);
            const x = frac * 24;

            if (eid === 'sensor.master_control_master_demand') {
              const md = Math.max(0, Math.min(100, 46 + 44 * Math.sin(x * 0.55) + 10 * Math.cos(x * 1.4)));
              const isDhw = (bType === 'opentherm') && (frac > 0.25 && frac < 0.30);
              const flow = isDhw ? 62.0 : (41.0 + 0.18 * md);
              const ret = flow - 8.3 + 0.7 * Math.sin(x);
              const slot = i % 6;
              const relayActive = md >= 95 ? true : (md <= 5 ? false : slot < Math.round((md / 100) * 6));
              const solar = (bType === 'heat_pump') && (frac > 0.42 && frac < 0.68);
              rows.push({
                s: md.toFixed(1),
                lu,
                a: {
                  boiler_type: bType,
                  boiler_active: bType === 'relay' ? relayActive : (md > 5),
                  dhw_active: isDhw,
                  flow_temp: +flow.toFixed(1),
                  return_temp: +ret.toFixed(1),
                  modulation_level: isDhw ? 88 : Math.round(md * 0.85),
                  outdoor_temp: +(5.5 + 3.8 * Math.sin((x - 7) * Math.PI / 12)).toFixed(1),
                  solar_boost_active: solar,
                  battery_soc: Math.round(52 + 38 * Math.sin(x * 0.22))
                }
              });
            } else if (eid === 'sensor.master_control_frequenza_accensioni_caldaia') {
              rows.push({ s: (1.4 + 0.9 * Math.sin(x * 0.4) + 0.3 * Math.cos(x * 1.2)).toFixed(1), lu, a: {} });
            } else if (eid === 'sensor.master_control_ore_funzionamento_caldaia_24h') {
              rows.push({ s: (0.4 + frac * 3.8).toFixed(1), lu, a: {} });
            } else if (eid.startsWith('climate.')) {
              const zIdx = eid.includes('_1') ? 1 : (eid.includes('_2') ? 2 : 3);
              const sp = zIdx === 3 ? 20.0 : 20.5;
              const isWin = (zIdx === 1) && (frac >= 0.35 && frac <= 0.41);
              const drop = isWin ? -0.95 * Math.sin(((frac - 0.35) / 0.06) * Math.PI) : 0;
              const cur = sp + (zIdx === 3 ? 0.36 * Math.sin(x * 0.85) : -0.15 - 0.35 * Math.sin(x * 0.4 + zIdx)) + drop;
              rows.push({ s: 'heat', lu, a: { current_temperature: +cur.toFixed(2), temperature: sp } });
            } else if (eid.endsWith('_demand')) {
              const zIdx = eid.includes('_1') ? 1 : (eid.includes('_2') ? 2 : 3);
              const isWin = (zIdx === 1) && (frac >= 0.35 && frac <= 0.41);
              if (zIdx === 3) {
                const hystOn = Math.sin(x * 0.85) < 0.1;
                rows.push({ s: hystOn ? '100.0' : '0.0', lu, a: { control_mode: 'hysteresis', window_open: false } });
              } else {
                const sp = 20.5;
                const pv = sp - 0.15 - 0.35 * Math.sin(x * 0.4 + zIdx) + (isWin ? -0.9 : 0);
                const pt = isWin ? 0 : (sp - pv) * (zIdx === 2 ? 36.4 : 48.2);
                const it = isWin ? 0 : Math.max(0, 22 + 10 * Math.sin(x * 0.25 + zIdx));
                const dt = isWin ? 0 : -4.2 * Math.cos(x * 0.4 + zIdx);
                const wff = isWin ? 0 : 8.5;
                const dem = isWin ? 0 : Math.max(0, Math.min(100, pt + it + dt + wff));
                const pwmSlot = i % 6;
                rows.push({
                  s: dem.toFixed(1),
                  lu,
                  a: {
                    control_mode: 'smart_pid',
                    window_open: isWin,
                    pwm_output_on: dem >= 95 ? true : (dem <= 5 ? false : pwmSlot < Math.round((dem / 100) * 6)),
                    p_term: +pt.toFixed(1),
                    i_term: +it.toFixed(1),
                    d_term: +dt.toFixed(1),
                    weather_ff: wff
                  }
                });
              }
            } else if (eid.includes('heating_rate')) {
              const base = eid.includes('_1') ? 1.50 : (eid.includes('_2') ? 1.20 : 0.90);
              rows.push({ s: (base + 0.08 * Math.sin(x * 0.5)).toFixed(2), lu, a: {} });
            } else if (eid.includes('cooling_rate')) {
              const base = eid.includes('_1') ? 0.26 : (eid.includes('_2') ? 0.34 : 0.42);
              rows.push({ s: (base + 0.02 * Math.cos(x * 0.4)).toFixed(2), lu, a: {} });
            } else if (eid.includes('thermal_inertia')) {
              const base = eid.includes('_1') ? 0.12 : (eid.includes('_2') ? 0.15 : 0.19);
              rows.push({ s: (base + 0.02 * Math.sin(x * 0.7)).toFixed(2), lu, a: {} });
            }
          }
          out[eid] = rows;
        });
        return out;
      },

      callService: function(domain, service, data) {
        if (domain === 'climate' && service === 'set_temperature') {
          const eid = data.entity_id;
          if (MOCK_HASS.states[eid]) {
            MOCK_HASS.states[eid].attributes.temperature = data.temperature;
            const cur = MOCK_HASS.states[eid].attributes.current_temperature;
            const isMasterOn = MOCK_HASS.states['switch.master_control_heating_master'].state === 'on';
            if (isMasterOn) {
              MOCK_HASS.states[eid].attributes.hvac_action = data.temperature > cur ? 'heating' : 'idle';
            }
          }
        } else if (domain === 'select' && service === 'select_option') {
          const eid = data.entity_id;
          if (MOCK_HASS.states[eid]) {
            MOCK_HASS.states[eid].state = data.option;
            if (eid.includes('global_preset')) {
              const presets = {
                comfort: { z1: 20.5, z2: 20.5, z3: 20.0 },
                eco: { z1: 18.5, z2: 18.0, z3: 18.0 },
                sleep: { z1: 17.5, z2: 18.0, z3: 17.0 },
                away: { z1: 16.0, z2: 16.0, z3: 16.0 },
                manual: {}
              };
              if (presets[data.option]) {
                const p = presets[data.option];
                if (p.z1) MOCK_HASS.states['climate.multizone_thermostat_zona_test_1'].attributes.temperature = p.z1;
                if (p.z2) MOCK_HASS.states['climate.multizone_thermostat_zona_test_2'].attributes.temperature = p.z2;
                if (p.z3) MOCK_HASS.states['climate.multizone_thermostat_zona_test_3'].attributes.temperature = p.z3;
              }
            }
            if (eid.includes('heat_source_priority')) {
              const priority = data.option;
              const z1 = MOCK_HASS.states['climate.multizone_thermostat_zona_test_1'];
              const z2 = MOCK_HASS.states['climate.multizone_thermostat_zona_test_2'];
              const z3 = MOCK_HASS.states['climate.multizone_thermostat_zona_test_3'];
              if (priority === 'electric_only') {
                if (z1) z1.attributes.active_heating_source = 'electric';
                if (z2) z2.attributes.active_heating_source = 'electric';
                if (z3) z3.attributes.active_heating_source = 'gas';
              } else if (priority === 'combined') {
                if (z1) z1.attributes.active_heating_source = 'dual';
                if (z2) z2.attributes.active_heating_source = 'dual';
                if (z3) z3.attributes.active_heating_source = 'gas';
              } else if (priority === 'gas_only') {
                if (z1) z1.attributes.active_heating_source = 'gas';
                if (z2) z2.attributes.active_heating_source = 'gas';
                if (z3) z3.attributes.active_heating_source = 'gas';
              } else {
                if (z1) z1.attributes.active_heating_source = 'electric';
                if (z2) z2.attributes.active_heating_source = 'gas';
                if (z3) z3.attributes.active_heating_source = 'gas';
              }
            }
            if (eid.includes('master_operation_mode')) {
              const isCool = (data.option === 'cool');
              const isMasterOn = (MOCK_HASS.states['switch.master_control_heating_master'].state === 'on');
              MOCK_HASS.states['switch.caldaia'].state = (!isCool && isMasterOn) ? 'on' : 'off';
              ['climate.multizone_thermostat_zona_test_1', 'climate.multizone_thermostat_zona_test_2', 'climate.multizone_thermostat_zona_test_3'].forEach(zid => {
                const z = MOCK_HASS.states[zid];
                if (z) {
                  if (isMasterOn) {
                    const canCool = z.attributes.can_cool !== false;
                    z.state = isCool ? (canCool ? 'cool' : 'off') : 'heat';
                    z.attributes.hvac_action = isCool ? (canCool ? 'cooling' : 'off') : 'heating';
                  } else {
                    z.state = 'off';
                    z.attributes.hvac_action = z.attributes.split_active ? 'heating' : 'off';
                  }
                }
              });
            }
            if (eid.includes('zone_mode')) {
              const zoneMap = {
                'select.multizone_thermostat_zona_test_1_zone_mode': 'climate.multizone_thermostat_zona_test_1',
                'select.multizone_thermostat_zona_test_2_zone_mode': 'climate.multizone_thermostat_zona_test_2',
                'select.multizone_thermostat_zona_test_3_zone_mode': 'climate.multizone_thermostat_zona_test_3'
              };
              const targetClimate = zoneMap[eid];
              if (targetClimate && MOCK_HASS.states[targetClimate]) {
                MOCK_HASS.states[targetClimate].attributes.zone_mode = data.option;
              }
            }
          }
        } else if (domain === 'switch') {
          const eid = data.entity_id;
          if (MOCK_HASS.states[eid]) {
            const turnOn = (service === 'toggle') ? (MOCK_HASS.states[eid].state !== 'on') : (service === 'turn_on');
            MOCK_HASS.states[eid].state = turnOn ? 'on' : 'off';
            if (eid.includes('master_control_heating_master') || eid.includes('master')) {
              const isCool = (MOCK_HASS.states['select.master_control_master_operation_mode']?.state === 'cool');
              MOCK_HASS.states['switch.caldaia'].state = (!isCool && turnOn) ? 'on' : 'off';
              ['climate.multizone_thermostat_zona_test_1', 'climate.multizone_thermostat_zona_test_2', 'climate.multizone_thermostat_zona_test_3'].forEach(zid => {
                const z = MOCK_HASS.states[zid];
                if (z) {
                  if (turnOn) {
                    const canCool = z.attributes.can_cool !== false;
                    z.state = isCool ? (canCool ? 'cool' : 'off') : 'heat';
                    z.attributes.hvac_action = isCool ? (canCool ? 'cooling' : 'off') : 'heating';
                  } else {
                    z.state = z.attributes.split_active ? 'heat' : 'off';
                    z.attributes.hvac_action = z.attributes.split_active ? 'heating' : 'off';
                  }
                }
              });
            }
          }
        } else if (domain === 'climate' && service === 'set_hvac_mode') {
          const eid = data.entity_id;
          const hvacMode = data.hvac_mode;
          if (MOCK_HASS.states[eid]) {
            MOCK_HASS.states[eid].state = hvacMode;
            if (eid === 'climate.multizone_thermostat_zona_test_1' || eid === 'climate.split_test_1') {
              const isSplitActive = (hvacMode !== 'off');
              const z1 = MOCK_HASS.states['climate.multizone_thermostat_zona_test_1'];
              const sp1 = MOCK_HASS.states['climate.split_test_1'];
              if (z1) {
                z1.attributes.split_active = isSplitActive;
                z1.attributes.split_manual_on = isSplitActive;
                z1.attributes.active_heating_source = isSplitActive ? 'electric' : 'gas';
                const isMasterOn = MOCK_HASS.states['switch.master_control_heating_master'].state === 'on';
                z1.attributes.hvac_action = isSplitActive ? 'heating' : (isMasterOn ? 'heating' : 'off');
              }
              if (sp1) sp1.state = hvacMode;
            }
          }
        }
        updateAllCards();
      }
    };

    let activeCards = [];
    let telemetryCardEl = null;

    function openTelemetryTab(targetKey) {
      if (targetKey) {
        try { sessionStorage.setItem('mz_telemetry_target', targetKey); } catch (e) {}
      }
      switchView('view-telemetry');
    }

    function mountCards() {
      activeCards = [];

      const presetCard = document.createElement('multizone-thermostat-preset-card');
      presetCard.setConfig({ border_radius: '20px' });
      document.getElementById('host-preset-card').appendChild(presetCard);
      activeCards.push(presetCard);

      const statusCard = document.createElement('multizone-thermostat-status-card');
      statusCard.setConfig({ border_radius: '20px' });
      document.getElementById('host-status-card').appendChild(statusCard);
      activeCards.push(statusCard);

      const schedSummary = document.createElement('multizone-thermostat-schedule-summary-card');
      schedSummary.setConfig({ border_radius: '20px', navigation_path: 'programmazione' });
      const hostSched = document.getElementById('host-schedule-summary');
      hostSched.appendChild(schedSummary);
      hostSched.addEventListener('click', (e) => { e.stopPropagation(); switchView('view-sched'); }, true);
      activeCards.push(schedSummary);

      const healthSummary = document.createElement('multizone-thermostat-health-summary-card');
      healthSummary.setConfig({ border_radius: '20px', navigation_path: 'diagnostica' });
      const hostHealth = document.getElementById('host-health-summary');
      hostHealth.appendChild(healthSummary);
      hostHealth.addEventListener('click', (e) => { e.stopPropagation(); switchView('view-diag'); }, true);
      activeCards.push(healthSummary);

      const dial1 = document.createElement('multizone-thermostat-dial-card');
      dial1.setConfig({ entity: 'climate.multizone_thermostat_zona_test_1', switch: 'select.multizone_thermostat_zona_test_1_zone_mode', hide_if_cannot_cool: true, border_radius: '20px' });
      document.getElementById('host-dial-1').appendChild(dial1);
      activeCards.push(dial1);

      const dial2 = document.createElement('multizone-thermostat-dial-card');
      dial2.setConfig({ entity: 'climate.multizone_thermostat_zona_test_2', switch: 'select.multizone_thermostat_zona_test_2_zone_mode', hide_if_cannot_cool: true, border_radius: '20px' });
      document.getElementById('host-dial-2').appendChild(dial2);
      activeCards.push(dial2);

      const dial3 = document.createElement('multizone-thermostat-dial-card');
      dial3.setConfig({ entity: 'climate.multizone_thermostat_zona_test_3', switch: 'select.multizone_thermostat_zona_test_3_zone_mode', hide_if_cannot_cool: true, border_radius: '20px' });
      document.getElementById('host-dial-3').appendChild(dial3);
      activeCards.push(dial3);

      const schedulerCard = document.createElement('multizone-thermostat-scheduler-card');
      schedulerCard.setConfig({});
      document.getElementById('host-scheduler-card').appendChild(schedulerCard);
      activeCards.push(schedulerCard);

      const plantCard = document.createElement('multizone-thermostat-plant-card');
      plantCard.setConfig({ border_radius: '20px' });
      document.getElementById('host-plant-card').appendChild(plantCard);
      activeCards.push(plantCard);

      const energy1 = document.createElement('multizone-thermostat-zone-energy-card');
      energy1.setConfig({ entity: 'climate.multizone_thermostat_zona_test_1', border_radius: '20px' });
      document.getElementById('host-energy-1').appendChild(energy1);
      activeCards.push(energy1);

      const energy2 = document.createElement('multizone-thermostat-zone-energy-card');
      energy2.setConfig({ entity: 'climate.multizone_thermostat_zona_test_2', border_radius: '20px' });
      document.getElementById('host-energy-2').appendChild(energy2);
      activeCards.push(energy2);

      const energy3 = document.createElement('multizone-thermostat-zone-energy-card');
      energy3.setConfig({ entity: 'climate.multizone_thermostat_zona_test_3', border_radius: '20px' });
      document.getElementById('host-energy-3').appendChild(energy3);
      activeCards.push(energy3);

      telemetryCardEl = document.createElement('multizone-thermostat-telemetry-card');
      if (telemetryCardEl && typeof telemetryCardEl.setConfig === 'function') {
        telemetryCardEl.setConfig({ border_radius: '20px' });
      }
      document.getElementById('host-telemetry-card').appendChild(telemetryCardEl);
      activeCards.push(telemetryCardEl);

      document.querySelectorAll('[data-sim-backend]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const bType = btn.dataset.simBackend;
          document.querySelectorAll('[data-sim-backend]').forEach(b => b.classList.toggle('active', b === btn));
          const md = MOCK_HASS.states['sensor.master_control_master_demand'];
          const ph = MOCK_HASS.states['sensor.master_control_stato_salute_impianto'];
          if (md) md.attributes.boiler_type = bType;
          if (ph && ph.attributes && ph.attributes.opentherm) {
            ph.attributes.opentherm.enabled = (bType === 'opentherm');
          }
          if (telemetryCardEl) {
            telemetryCardEl._historyCache = {};
            telemetryCardEl._lastUpdateMs = 0;
          }
          updateAllCards();
        });
      });

      updateAllCards();
    }

    function updateAllCards() {
      const hassCopy = {
        language: MOCK_HASS.language,
        locale: { language: MOCK_HASS.language },
        states: Object.assign({}, MOCK_HASS.states),
        callService: MOCK_HASS.callService,
        callWS: MOCK_HASS.callWS
      };

      activeCards.forEach(c => {
        try {
          if (c === telemetryCardEl) c._lastUpdateMs = 0;
          c.hass = hassCopy;
        } catch (e) { console.error(e); }
      });

      setTimeout(() => {
        ['host-dial-1', 'host-dial-2', 'host-dial-3'].forEach(id => {
          const host = document.getElementById(id);
          if (host && host.firstElementChild) {
            host.style.display = host.firstElementChild.style.display === 'none' ? 'none' : '';
          }
        });
      }, 20);
    }

    function switchView(viewId) {
      document.querySelectorAll('.dashboard-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.ha-tab').forEach(t => t.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');
      if (viewId === 'view-home') document.getElementById('tabBtnHome').classList.add('active');
      if (viewId === 'view-sched') document.getElementById('tabBtnSched').classList.add('active');
      if (viewId === 'view-diag') document.getElementById('tabBtnDiag').classList.add('active');
      if (viewId === 'view-telemetry') document.getElementById('tabBtnTelemetry').classList.add('active');
      if (typeof closeMzStandaloneModal === 'function') closeMzStandaloneModal();
      setTimeout(updateAllCards, 40);
    }

    window.addEventListener('hass-navigate', (e) => {
      const path = String(e.detail?.path || '').toLowerCase();
      if (path.includes('programmazione') || path.includes('scheduler')) {
        switchView('view-sched');
      } else if (path.includes('telemetria') || path.includes('telemetry')) {
        switchView('view-telemetry');
      } else if (path.includes('diagnostica') || path.includes('diagnostics')) {
        switchView('view-diag');
      } else {
        switchView('view-home');
      }
    });

    const UI_I18N = {

      },

      },
      es: {
        tab_thermostats: "Termostatos", tab_scheduling: "Programación", tab_diagnostics: "Diagnóstico", tab_telemetry: "Gráficos y Telemetría",
        col_2: "Cuadrícula: 2 Columnas", col_3: "Cuadrícula: 3 Columnas", style_luxury: "Estilo: Luxury", style_classic: "Estilo: Classic",
        living_room: "Salón", kitchen: "Cocina", office: "Despacho",

      },

    function changeLanguage(lang) {
      if (!UI_I18N[lang]) lang = 'en';
      MOCK_HASS.language = lang;
      localStorage.setItem('mz_simulator_lang', lang);
      const t = UI_I18N[lang];
      document.querySelector('#tabBtnHome span').textContent = t.tab_thermostats;
      document.querySelector('#tabBtnSched span').textContent = t.tab_scheduling;
      document.querySelector('#tabBtnDiag span').textContent = t.tab_diagnostics;
      document.querySelector('#tabBtnTelemetry span').textContent = t.tab_telemetry;
      document.getElementById('colBtnText').textContent = currentCols === 2 ? t.col_2 : t.col_3;
      document.getElementById('styleBtnText').textContent = isLuxury ? t.style_luxury : t.style_classic;
      document.getElementById('sim-backend-lbl').textContent = t.sim_backend_lbl;

      MOCK_HASS.states['climate.multizone_thermostat_zona_test_1'].attributes.friendly_name = t.living_room;
      MOCK_HASS.states['climate.multizone_thermostat_zona_test_2'].attributes.friendly_name = t.kitchen;
      MOCK_HASS.states['climate.multizone_thermostat_zona_test_3'].attributes.friendly_name = t.office;
      MOCK_HASS.states['switch.caldaia'].attributes.friendly_name = t.boiler_name;
      MOCK_HASS.states['sensor.master_control_frequenza_accensioni_caldaia'].attributes.unit_of_measurement = t.cycles_unit;
      MOCK_HASS.states['sensor.multizone_brain_zona_test_1_dimensionamento_radiatore'].state = t.optimal;
      MOCK_HASS.states['sensor.multizone_brain_zona_test_2_dimensionamento_radiatore'].state = t.optimal;
      MOCK_HASS.states['sensor.multizone_brain_zona_test_3_dimensionamento_radiatore'].state = t.undersized;

      updateAllCards();
    }

    let currentCols = 2;
    function toggleCols() {
      currentCols = currentCols === 2 ? 3 : 2;
      document.querySelectorAll('.ha-zones-grid').forEach(g => g.classList.toggle('cols-3', currentCols === 3));
      const t = UI_I18N[MOCK_HASS.language] || UI_I18N.en;
      document.getElementById('colBtnText').textContent = currentCols === 2 ? t.col_2 : t.col_3;
    }

    let isLuxury = localStorage.getItem('mz_card_style') !== 'classic';
    function toggleStyle() {
      isLuxury = !isLuxury;
      const newStyle = isLuxury ? 'luxury' : 'classic';
      localStorage.setItem('mz_card_style', newStyle);
      const btn = document.getElementById('styleSwitcherBtn');
      const icon = document.getElementById('styleBtnIcon');
      const text = document.getElementById('styleBtnText');
      const t = UI_I18N[MOCK_HASS.language] || UI_I18N.en;
      if (isLuxury) {
        btn.classList.add('luxury-active'); icon.textContent = '💎'; text.textContent = t.style_luxury;
        document.body.classList.remove('classic-theme');
      } else {
        btn.classList.remove('luxury-active'); icon.textContent = '🏛️'; text.textContent = t.style_classic;
        document.body.classList.add('classic-theme');
      }
      window.dispatchEvent(new CustomEvent('mz-style-changed', { detail: { style: newStyle } }));
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('mz_simulator_lang') || 'en';
      const langSel = document.getElementById('langSelector');
      if (langSel) langSel.value = savedLang;
      if (!isLuxury) {
        isLuxury = false;
        document.getElementById('styleSwitcherBtn').classList.remove('luxury-active');
        document.getElementById('styleBtnIcon').textContent = '🏛️';
        document.body.classList.add('classic-theme');
      }
      mountCards();
      changeLanguage(savedLang);
    });
  </script>
